name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codex-provider-switcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os; from codex_provider_switcher import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__'
      - name: Test before publishing
        run: |
          sh -n install.sh
          python -m unittest discover -s tests -v
      - name: Smoke-test standalone installer
        run: |
          CODEX_SWITCHER_BIN_DIR="$RUNNER_TEMP/cps-standalone/bin" \
          CODEX_SWITCHER_DATA_DIR="$RUNNER_TEMP/cps-standalone/data" \
            sh install.sh
          "$RUNNER_TEMP/cps-standalone/bin/cps" --version
          "$RUNNER_TEMP/cps-standalone/bin/codex-provider-switcher" --version
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
