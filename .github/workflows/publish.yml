name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codex-provider-switcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test before publishing
        run: |
          sh -n install.sh
          python -m unittest discover -s tests -v
      - name: Smoke-test standalone installer
        run: |
          CODEX_SWITCHER_BIN_DIR="$RUNNER_TEMP/cps-standalone/bin" \
          CODEX_SWITCHER_DATA_DIR="$RUNNER_TEMP/cps-standalone/data" \
            sh install.sh
          "$RUNNER_TEMP/cps-standalone/bin/cps" --version
          "$RUNNER_TEMP/cps-standalone/bin/codex-provider-switcher" --version
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
